{{ $url := .Get "url" }}
{{ $width := .Get "width" | default "100%" }}
{{ $height := .Get "height" | default "480" }}

<div style="margin: 2rem 0; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
  <iframe 
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
    src="{{ $url }}" 
    allowfullscreen="">
  </iframe>
</div>
