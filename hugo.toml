baseURL = "https://avinmendiratta.github.io/"
locale = "en-us"
title = "Le voyage de Bhārata"
theme = "no-fate"

[outputs]
  home = ["HTML", "JSON", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

[[menu.main]]
  name = "Yuktiyā"
  url = "/yuktiyā/"
  weight = 1

[[menu.main]]
  name = "Airānova"
  url = "/airānova/"
  weight = 2

[[menu.main]]
  name = "Salt"
  url = "/salt/"
  weight = 3

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4

[params]
  author = ""
  description = "When are we, where are we and how did we get here?"

  [params.noFate]
    style = "wild"
    defaultMode = "editorial"
    defaultAccent = "signal"
    showThemeToggle = true
    showSearch = false
    showReadingTime = true
    enableImageProcessing = true

    [params.noFate.home]
      modules = ["opening", "featured_archive", "selected_writing", "visual_interruption"]

    [params.noFate.wild]
      masthead = "Chaitra Shukla Pratipada"
      issue = "2140"
      strapline = "Demands of Identity, Loyalty and Honesty"

    [params.noFate.images]
      widths = [480, 800, 1200, 1600]
      webpQuality = 82

[markup]
  [markup.highlight]
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[privacy]
  [privacy.youtube]
    privacyEnhanced = true
